[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "django-admin-inline-controls"
version = "0.1.0"
description = "Pagination, filtering and ordering for Django admin inlines."
readme = "README.md"
keywords = [ "admin", "django", "filter", "inline", "ordering", "pagination" ]
license = "MIT"
license-files = [ "LICENSE" ]
maintainers = [ { name = "Rodolfo Valentín Becerra García", email = "rodolvbg@gmail.com" } ]
authors = [ { name = "Rodolfo Valentín Becerra García", email = "rodolvbg@gmail.com" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [ "django>=4.2" ]
optional-dependencies.dev = [
  "coverage[toml]>=7.4",
  "django-stubs[compatible-mypy]>=5",
  "mypy>=1.10",
  "pre-commit>=4",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-django>=4.8",
  "pytest-playwright>=0.5",
  "ruff>=0.6",
  "tox>=4",
  "tox-uv>=1",
]
optional-dependencies.filters = [ "django-filter>=23.2" ]
optional-dependencies.nested = [ "django-nested-admin>=4.1" ]
optional-dependencies.unfold = [ "django-unfold>=0.108; python_version>='3.12'" ]
urls.Homepage = "https://github.com/rodolvbg/django-admin-inline-controls"
urls.Issues = "https://github.com/rodolvbg/django-admin-inline-controls/issues"
urls.Repository = "https://github.com/rodolvbg/django-admin-inline-controls"

[dependency-groups]
dev = [
  "coverage[toml]>=7.4",
  "django-filter>=23.2",
  "django-nested-admin>=4.1",
  "django-stubs[compatible-mypy]>=5",
  "django-unfold>=0.108; python_version>='3.12'",
  "mypy>=1.10",
  "pre-commit>=4",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-django>=4.8",
  "pytest-playwright>=0.5",
  "ruff>=0.6",
  "tox>=4",
  "tox-uv>=1",
]

[tool.hatch]
build.targets.wheel.packages = [ "src/django_admin_inline_controls" ]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [ "**/migrations/*.py" ]
lint.select = [ "B", "DJ", "E", "F", "I", "UP" ]

[tool.mypy]
mypy_path = "src:example"
python_version = "3.10"
warn_redundant_casts = true
warn_unused_ignores = true
plugins = [ "mypy_django_plugin.main" ]
overrides = [
  { module = [ "django_filters.*", "nested_admin.*", "unfold", "unfold.*" ], ignore_missing_imports = true }
]

[tool.django-stubs]
django_settings_module = "example.settings"

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "src", "example", "." ]
ini_options.addopts = "--no-migrations --cov=django_admin_inline_controls --cov-report=term-missing"
ini_options.DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.coverage]
run.branch = true
run.source = [ "django_admin_inline_controls" ]
report.show_missing = true
report.skip_covered = true

[tool.tox]
env_list = [
  "py314-dj52",
  "py314-dj52-extras",
  "py314-dj60",
  "py314-dj61",
  "py314-dj61-extras",
  "py314-dj61-unfold",
  "py313-dj51",
  "py312-dj42",
  "py312-dj50",
  "py312-dj52-unfold",
  "py312-dj60",
  "py312-dj61",
  "py310-dj42",
  "py310-dj42-extras",
  "py310-dj50",
  "py310-dj51",
  "py310-dj52",
]
env_run_base.commands = [ [ "pytest", "tests", "--ignore=tests/e2e", "--no-cov", "{posargs}" ] ]
env_run_base.deps = [
  "pytest",
  "pytest-django",
  "pytest-cov",
  { replace = "if", condition = "factor.dj42", then = [ "django>=4.2,<4.3" ], extend = true },
  { replace = "if", condition = "factor.dj50", then = [ "django>=5.0,<5.1" ], extend = true },
  { replace = "if", condition = "factor.dj51", then = [ "django>=5.1,<5.2" ], extend = true },
  { replace = "if", condition = "factor.dj52", then = [ "django>=5.2,<5.3" ], extend = true },
  { replace = "if", condition = "factor.dj60", then = [ "django>=6.0,<6.1" ], extend = true },
  { replace = "if", condition = "factor.dj61", then = [ "django>=6.1,<6.2" ], extend = true },
  { replace = "if", condition = "factor.extras", then = [ "django-filter>=23.2", "django-nested-admin>=4.1" ], extend = true },
  { replace = "if", condition = "factor.unfold", then = [ "django-unfold>=0.108" ], extend = true },
]
env_run_base.package = "wheel"
env_run_base.wheel_build_env = ".pkg"
